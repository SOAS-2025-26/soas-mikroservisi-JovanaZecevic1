networks:
  soas-net:
    driver: bridge

services:

  naming-server:
    build:
      context: ./backend
      dockerfile: naming-server/Dockerfile
    container_name: naming-server
    ports:
      - "8761:8761"
    networks:
      - soas-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  users-service:
    build:
      context: ./backend
      dockerfile: users-service/Dockerfile
    container_name: users-service
    ports:
      - "8770:8770"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=users-service
    networks:
      - soas-net
    depends_on:
      naming-server:
        condition: service_healthy

  bank-account-service:
    build:
      context: ./backend
      dockerfile: bank-account-service/Dockerfile
    container_name: bank-account-service
    ports:
      - "8200:8200"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=bank-account-service
    networks:
      - soas-net
    depends_on:
      naming-server:
        condition: service_healthy

  crypto-wallet-service:
